<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      :root {
        --primary-blue: #003366;
        --secondary-orange: #FF6B00;
        --text-dark: #1e293b;
        --glass-bg: rgba(255, 255, 255, 0.95);
      }

      body {
        font-family: 'Sarabun', 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        background-attachment: fixed;
        color: var(--text-dark);
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 600px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .logo-area { margin-bottom: 25px; }
      
      .logos-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      .logos-wrapper img {
        max-height: 70px;
        width: auto;
        object-fit: contain;
      }

      .logo-divider {
        height: 50px;
        width: 2px;
        background-color: #cbd5e1;
        border-radius: 2px;
      }

      h2 { 
        color: var(--primary-blue); 
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        margin: 0 0 5px 0;
        font-size: 28px;
      }

      .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .search-group {
        position: relative;
        margin-bottom: 25px;
      }

      input[type="text"] {
        width: 100%;
        padding: 16px 20px 16px 50px;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
      }

      input[type="text"]:focus {
        border-color: var(--secondary-orange);
        box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
        outline: none;
      }

      .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
      }

      button {
        width: 100%;
        padding: 16px;
        background: var(--primary-blue);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      button:hover {
        background: #002244;
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 51, 102, 0.3);
      }

      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
      }

      #result { margin-top: 30px; }

      .card {
        background: white;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 16px;
        text-align: left;
        border-left: 6px solid var(--secondary-orange);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .card:hover { transform: scale(1.02); }

      .card h4 { 
        margin: 0; 
        color: var(--primary-blue);
        font-size: 18px;
      }

      .btn-group { display: flex; gap: 10px; }

      .btn {
        flex: 1;
        text-align: center;
        padding: 10px;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .btn-view { background-color: #334155; }
      .btn-download { background-color: var(--secondary-orange); }
      
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid var(--secondary-orange);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        display: none;
      }

      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      @media (max-width: 480px) {
        .logos-wrapper img { max-height: 50px; }
        .logo-divider { height: 40px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-area">
        <div class="logos-wrapper">
          <img src="https://kbu.ac.th/wp-content/uploads/2024/09/KasemEnglishLogo.webp" alt="Kasem Bundit University Logo">
          <div class="logo-divider"></div>
          <img src="https://kbu.ac.th/wp-content/uploads/2024/08/LOGO-CA.png" alt="CommArts KBU Logo">
        </div>
        
        <h2>ค้นหาเกียรติบัตร</h2>
        <div class="subtitle">CommArts KBU Camp</div>
      </div>
      
      <div class="search-group">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="พิมพ์ชื่อ-นามสกุล ของคุณ..." onkeypress="handleKeyPress(event)" />
      </div>

      <button onclick="search()" id="searchBtn">
        <i class="fa-solid fa-search"></i> ค้นหาไฟล์
      </button>

      <div id="loader" class="loader"></div>
      <div id="result"></div>
    </div>

    <script>
      function handleKeyPress(e) { if (e.keyCode === 13) { search(); } }

      function search() {
        var name = document.getElementById('searchInput').value;
        if(name.trim() === "") {
           alert("กรุณาพิมพ์ชื่อที่ต้องการค้นหา");
           return;
        }
        
        document.getElementById('result').innerHTML = "";
        document.getElementById('loader').style.display = "block";
        document.getElementById('searchBtn').disabled = true;

        // ⚠️ ลบคำว่า YOUR_WEB_APP_URL ออก แล้วใส่ลิงก์ Web App ของคุณลงไปแทน (ต้องมีเครื่องหมายคำพูดคลุมไว้เหมือนเดิม)
        var webAppUrl = "https://script.google.com/macros/s/AKfycbxTK6lWwSpjWR-TtXgx3EnqVKPWoHLHYywIEbB5boSBSQPM0bSuCmYrjuroK_h22oJp/exec"; 
        
        // สร้าง URL สำหรับยิง API
        var requestUrl = webAppUrl + "?searchName=" + encodeURIComponent(name);

        // ใช้ fetch แทน google.script.run
        fetch(requestUrl)
          .then(response => response.json())
          .then(data => {
            displayResult(data);
          })
          .catch(error => {
            console.error(error);
            displayError({ message: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาตรวจสอบลิงก์ Web App" });
          });
      }

      function displayResult(files) {
        document.getElementById('loader').style.display = "none";
        document.getElementById('searchBtn').disabled = false;
        var resultDiv = document.getElementById('result');
        
        if (files.length === 0) {
          resultDiv.innerHTML = "<div style='color:#ef4444; padding: 20px; background: #fee2e2; border-radius: 12px;'>❌ ไม่พบข้อมูล โปรดตรวจสอบการสะกด</div>";
          return;
        }

        var html = "<div style='margin-bottom:15px; font-weight:700; color:var(--primary-blue)'>พบทั้งหมด " + files.length + " รายการ</div>";
        for (var i = 0; i < files.length; i++) {
          html += "<div class='card'>";
          html += "<h4><i class='fa-solid fa-file-pdf' style='color:#ef4444'></i> " + files[i].name + "</h4>";
          html += "<div class='btn-group'>";
          html += "<a href='" + files[i].viewUrl + "' target='_blank' class='btn btn-view'><i class='fa-solid fa-eye'></i> ดูไฟล์</a>";
          html += "<a href='" + files[i].downloadUrl + "' class='btn btn-download'><i class='fa-solid fa-download'></i> ดาวน์โหลด</a>";
          html += "</div></div>";
        }
        resultDiv.innerHTML = html;
      }

      function displayError(error) {
        document.getElementById('loader').style.display = "none";
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('result').innerHTML = "<p style='color:#ef4444;'>เกิดข้อผิดพลาด: " + error.message + "</p>";
      }
    </script>
  </body>
</html>
